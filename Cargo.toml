[package]
name = "harley-termux"
version = "0.1.0"
edition = "2021"
description = "Harley's Termux-native toolkit: GSM/ADB helpers, HarleyLink client, memory sync"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
dirs = "5.0"
home = "0.5"
which = "6.0"

[profile.release]
opt-level = "z"  # optimize for size on mobile
lto = true
strip = true
panic = "abort"
codegen-units = 1

[target.aarch64-linux-android]
linker = "aarch64-linux-android21-clang"
rustflags = ["-C", "target-feature=+neon,+crypto"]